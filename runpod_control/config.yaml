---
runpod:
  # Runpod API key
  api_key: !secret runpod_api_key

  pod:
    name: comfyui
    image_name: "runpod/pytorch:2.4.0-py3.11-cuda12.4.1-devel-ubuntu22.04"
    #image_name: "runpod/pytorch:2.8.0-py3.11-cuda12.8.1-cudnn-devel-ubuntu22.04"

    # 50GB RAM / 48GB VRAM
    #gpu_type_id: "NVIDIA RTX A6000"
    #gpu_type_id: "NVIDIA A40"

    # 50GB RAM / 24GB VRAM
    gpu_type_id: "NVIDIA RTX A5000"

    # 94GB RAM / 48GB VRAM
    #gpu_type_id: "NVIDIA RTX 6000 Ada Generation"

    # 83GB RAM / 32GB VRAM
    # Requires Torch 2.7 or newer
    #gpu_type_id: "NVIDIA GeForce RTX 5090"

    cloud_type: "SECURE"

    # 10 is fine without kohya_ss, or 25 with kohya_ss
    container_disk_in_gb: 25
    volume_mount_path: "/workspace"

    # Either volume_in_gb (and likely data_center_id) or network_volume_id must be set
    volume_in_gb: 200
    data_center_id: "US-IL-1"
    #network_volume_id: !secret runpod_network_volume_id

    ports: "22/tcp"
    env:
      PUBLIC_KEY: !file "~/.ssh/id_ed25519.pub"
    # Fallback to default /start.sh script if custom start script fails or is not present.
    docker_args: "bash -c '/workspace/scripts/container/start.sh || /start.sh'"

    # Debug - use Runpod's startup script that just starts sshd
    #docker_args: "bash -c '/start.sh'"

  # Terminate pod instead of stopping it, even if not using a network volume
  # True = terminate pod
  # False = stop pod
  # Not present = terminate if using network volume, stop if not
  terminate_pod: True

  modules:
    - huggingface
    - comfyui
    - wan
    - ollama
    #- kohya_ss

  models:
    - flux_common
    #- flux_inpainting
    - wan_common
    #- wan_t2v
    #- wan_vace
    #- wan_i2v
    - cosmos
    - cosmos_2b
    #- cosmos_14b

bootstrap:
  # Files to send in bootstrap tarball
  files:
    - "backup/workspace/.config/rclone"
    - "backup/workspace/.cache/huggingface"
    - "container/bootstrap.sh"

  # git repo to check out into /workspace/scripts
  repo: "https://github.com/rllynch/pod_on_demand.git"

  # List of remote ports to forward to local LAN for bootstrapping (e.g. local git repo)
  remote_forward: []
  #  - remote_addr_port: "2244"
  #    local_addr_port: "10.0.0.226:22"

ssh:
  # Update ~/.ssh/config with pod IP and port after connecting
  update_ssh_config: yes

  # Location of status loop script
  status_command: "/workspace/scripts/container/status_loop.py"

  # Percentage CPU utilization to prevent pod being terminated
  cpu_util_threshold: 10

  # Percentage GPU utilization to prevent pod being terminated
  gpu_util_threshold: 10

  # How long for CPU and GPU to below above thresholds before pod is terminated
  shutdown_timeout: 1800

web:
  # Time in seconds between creating pod and starting to establish SSH connection
  startup_wait_time: 10

  # How often to double check if the pod is running
  check_pod_interval: 120

  # Number of seconds of no web activity before terminating pod
  shutdown_timeout: 1800

  proxies:
    Status:
      local_bind_address: "127.0.0.1"
      local_port: 8000

      # No remote port - show status instead of proxying
      remote_port: 0

    ComfyUI:
      # Port on local machine to forward to the pod
      local_bind_address: "127.0.0.1"
      local_port: 8001

      # Port on pod to proxy to
      remote_port: 9020

    Kohya_ss:
      # Port on local machine to forward to the pod
      local_bind_address: "127.0.0.1"
      local_port: 8002

      # Port on pod to proxy to
      remote_port: 7860

periodic_tasks:
  # Run sync script every 60 seconds while pod is running
  sync:
    interval: 60
    command: "./sync"
